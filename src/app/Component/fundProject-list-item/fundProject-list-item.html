<div class="container">

    <div class="fund-card">
      <h2>Fund Accounts Summary</h2>
      @if (fundedProjects) {
      <h3>{{ fundedProjects.fundName }}</h3>
        <p>Fund Id: <b>{{fundedProjects.fundId}}</b></p>
        <p>Code: <b>{{ fundedProjects.fundCode }}</b></p>
        <p>Fund Manager: <b>{{ fundedProjects.fundManager}}</b></p>
        <p>Portfolio Manager: <b>{{ fundedProjects.portfolioManager}}</b></p>
        <p>Price: <b>${{ fundedProjects.startPrice }}</b></p>

      }
    </div>
</div>
